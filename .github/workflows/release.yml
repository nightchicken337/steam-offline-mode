name: release

# Builds the binary on a clean GitHub runner straight from this repository and
# publishes it with its SHA256, so nobody has to trust a binary built on some
# stranger's desktop.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1, not pwsh: the icon generator relies on
      # System.Drawing, which does not load cleanly under PowerShell 7.
      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\SteamOffline.exe -Algorithm SHA256).Hash
          Set-Content -Path dist\SteamOffline.exe.sha256 -Value "$hash  SteamOffline.exe" -Encoding ascii
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamOffline
          path: |
            dist/SteamOffline.exe
            dist/SteamOffline.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SteamOffline.exe
            dist/SteamOffline.exe.sha256
          generate_release_notes: true
